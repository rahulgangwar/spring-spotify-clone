services:
  # =========================
  # MySQL
  # =========================
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bootcamp
    ports:
      - "3306:3306"
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
    volumes:
      - mysql-data:/var/lib/mysql

  # =========================
  # Redis
  # =========================
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

  # =========================
  # Kafka - KRaft mode
  # =========================
  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "29092:29092"
    environment:
      # =========================
      # KRaft
      # =========================
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # =========================
      # Controller
      # =========================
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # =========================
      # Listeners
      # =========================
      # 9092 = Docker/internal communication
      # 29092 = Mac/host communication
      # 9093 = KRaft controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Broker-to-broker communication
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # =========================
      # Single node
      # =========================
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  # =========================
  # ZooKeeper
  # =========================
  # Not required by Kafka because
  # Kafka is running in KRaft mode.
  # Keeping it because you already use
  # ZooKeeper for other POCs.
  # =========================
  zookeeper:
    image: zookeeper:3.9
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_PORT: 2181
    volumes:
      - zookeeper-data:/data
      - zookeeper-datalog:/datalog

  # =========================
  # Kafka Connect + Debezium
  # =========================
  kafka-connect:
    image: quay.io/debezium/connect:3.0
    depends_on:
      - kafka
      - mysql
    ports:
      - "8083:8083"
    environment:
      # =========================
      # Kafka
      # =========================
      # Kafka Connect is inside Docker,
      # so it uses the INTERNAL listener.
      BOOTSTRAP_SERVERS: kafka:9092

      # =========================
      # Kafka Connect worker group
      # =========================
      GROUP_ID: 1

      # =========================
      # Kafka Connect internal topics
      # =========================
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status

      # Single Kafka broker
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      # =========================
      # JSON converters
      # =========================
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

  # =========================
  # Prometheus
  # =========================
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =========================
  # Grafana
  # =========================
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # =========================
  # Elasticsearch
  # =========================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  # =========================
  # Kibana
  # =========================
  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  # =========================
  # Logstash
  # =========================
  logstash:
    image: docker.elastic.co/logstash/logstash:9.1.3
    ports:
      - "5001:5000"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      - elasticsearch

# =========================
# Volumes
# =========================
volumes:
  mysql-data:
  zookeeper-data:
  zookeeper-datalog:
  es-data: