# Server Configuration
server:
  port: 8080
  # servlet:
  #   context-path: /api

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html

# Database Configuration
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/spotify_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC

  # Thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    mode: HTML


  # Spring DevTools
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

